name: Claude Code Review

on:
  pull_request:
    # No synchronize: at Sonnet/medium a re-review of the same diff on every
    # push is real spend. Comment @claude to re-run one on demand.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the review now always posts a verdict comment, and
      # resolves its own threads when the branch comes back clean.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # gh inside Claude's Bash calls needs its own token; the action's is
          # not exported to the tools it runs.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of
            ${{ github.repository }}.

            First read .claude/rules/code-review.md. Its "Project-specific
            invariants" section is the checklist for this repository - do not
            keep a second copy anywhere, read it fresh each run so the checklist
            follows the file.

            Then run: /code-review:code-review medium --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Findings, if any, go on the diff as inline comments. Leave every one
            of them unresolved - they are for a human to act on and close.

            Whatever the outcome, you MUST finish by posting exactly one
            top-level summary comment with `gh pr comment`. Silence is not an
            acceptable result: a run that says nothing is indistinguishable from
            a run that never happened, which is how this workflow sat broken for
            four days. The comment contains, in this order:

            1. A verdict line: `**PASS**` or `**CHANGES REQUESTED**`.
            2. The invariant checklist, one row per invariant from
               .claude/rules/code-review.md, each marked pass / fail / n-a with
               a few words saying why. "n-a" is for invariants the diff does not
               touch - most rows will be n-a on a small PR, and that is fine.
            3. A line stating whether `scripts/test.sh` coverage changed with
               the behaviour, per that file's "What counts as done" section.
            4. On CHANGES REQUESTED only: the findings, each one linking the
               inline comment you left for it.

            If the verdict is PASS, also resolve every unresolved review thread
            you opened on earlier runs of this PR, so a branch that has been
            fixed stops showing stale objections. Resolve only threads authored
            by you. Use the GraphQL resolveReviewThread mutation via `gh api
            graphql`. Never resolve a thread a human wrote, and never resolve
            anything when the verdict is CHANGES REQUESTED.
          # Sonnet + medium: this repo sees a handful of PRs, and they touch
          # shared logic - Haiku/low had nothing useful to say about a 63-file diff.
          claude_args: '--model claude-sonnet-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh api:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
