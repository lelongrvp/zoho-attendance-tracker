name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# One review per PR at a time: synchronize fires on every push, and a burst of
# commits would otherwise run several Sonnet reviews over diffs already stale.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the review now always posts a verdict comment, and
      # resolves its own threads when the branch comes back clean.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # gh inside Claude's Bash calls needs its own token; the action's is
          # not exported to the tools it runs.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of
            ${{ github.repository }}.

            First read .claude/rules/code-review.md. Its "Project-specific
            invariants" section is the checklist for this repository - do not
            keep a second copy anywhere, read it fresh each run so the checklist
            follows the file.

            Then run: /code-review:code-review medium --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Findings, if any, go on the diff as inline comments, left open
            while they stand - see the resolving rule at the end.

            Whatever the outcome, the verdict MUST reach the PR. Silence is
            not an acceptable result: a run that says nothing is
            indistinguishable from a run that never happened, which is how this
            workflow sat broken for four days.

            This workflow runs again on every push to an open PR, so the
            summary is one living comment rather than a new one each time:

              gh pr comment <n> --edit-last --create-if-none --body "..."

            That edits the summary already on the PR, or writes the first one.
            Never plain `gh pr comment` - it would leave a trail of stale
            verdicts, each contradicting the last.

            On PASS, additionally approve: `gh pr review <n> --approve --body`
            with a single line pointing at the summary comment. That is the
            green check a clean run should leave.

            If the approve call fails, the repository has "Allow GitHub Actions
            to create and approve pull requests" switched off. That is expected,
            not a failed run - say so in one closing line of the summary and
            carry on. The verdict has already reached the PR by then.

            On CHANGES REQUESTED, submit no review event at all. The updated
            summary and the unresolved inline comments are the signal. Never
            `--request-changes`: branch protection decides what blocks a merge
            here, not this workflow.

            The summary contains, in this order:

            1. A verdict line: `**PASS**` or `**CHANGES REQUESTED**`.
            2. The invariant checklist, one row per invariant from
               .claude/rules/code-review.md, each marked pass / fail / n-a with
               a few words saying why. "n-a" is for invariants the diff does not
               touch - most rows will be n-a on a small PR, and that is fine.
            3. A line stating whether `scripts/test.sh` coverage changed with
               the behaviour, per that file's "What counts as done" section.
            4. On CHANGES REQUESTED only: the findings, each one linking the
               inline comment you left for it.

            Resolving follows the finding, not the verdict. On every run,
            resolve any thread you opened whose finding the current diff has
            addressed - through `gh api graphql` and the resolveReviewThread
            mutation - and leave open every thread whose finding still stands.
            A PASS therefore closes all of yours; a push fixing two of three
            closes those two while the PR stays CHANGES REQUESTED. Resolve only
            threads you authored. Never touch a thread a human wrote, even to
            agree with it.
          # Sonnet + medium: these PRs touch shared logic, and Haiku/low had
          # nothing useful to say about a 63-file diff. Every push re-reviews,
          # which the concurrency group above keeps to one run at a time.
          claude_args: '--model claude-sonnet-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr view:*),Bash(gh api:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
